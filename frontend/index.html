    /* ── scrollbar ── */

    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ── drag-drop zone ── */
    #drop-zone.drag-over { border-color: #0ea5e9; background: rgba(14,165,233,.08); }

    /* ── toast ── */
    #toast-container { z-index: 9999; }
    .toast { animation: slideIn .3s ease, fadeOut .4s ease 3.6s forwards; }
    @keyframes slideIn  { from { transform: translateX(120%); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes fadeOut  { to   { opacity:0; transform: translateX(120%); } }

    /* ── chain-block card ── */
    .chain-card { border-left: 3px solid #334155; }
    .chain-card.GENESIS   { border-color: #64748b; }
    .chain-card.REGISTER  { border-color: #0ea5e9; }
    .chain-card.TRANSFER  { border-color: #f59e0b; }
    .chain-card.VERIFY    { border-color: #22c55e; }

    /* ── bar chart ── */
    .bar-track { background: #334155; border-radius: 4px; height: 14px; }
    .bar-fill  { background: #0ea5e9; height: 100%; border-radius: 4px; transition: width .6s ease; }

    /* ── hash mono ── */
    .hash { font-family: 'Courier New', monospace; font-size: .78rem; letter-spacing:.03em; }

    /* ── fade page ── */
    .page { animation: fadeP .2s ease; }
    @keyframes fadeP { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

    /* ── timeline ── */
    .tl-item:not(:last-child)::before {
      content:''; position:absolute; left:11px; top:28px;
      width:2px; bottom:-12px; background:#334155;

<!-- ════════════════════════════════════════════
     JAVASCRIPT
═════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════
   CONFIG & STATE
═══════════════════════════════════════════ */
const API = (window.location.protocol.startsWith('http')) ? window.location.origin : 'http://127.0.0.1:5000';
let STATE = {
  token: null,
  user:  null,
  role:  null,
  currentPage: null,
  evidenceList: [],
  auditPage: 1,
  auditPerPage: 20,
};

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
(function boot() {
  const tok  = localStorage.getItem('fl_token');
  const user = localStorage.getItem('fl_user');
  const role = localStorage.getItem('fl_role');
  if (tok && user) {
    STATE.token = tok; STATE.user = user; STATE.role = role || 'admin';
    showMain();
    navigate('dashboard');
  }
})();

/* ═══════════════════════════════════════════
   AUTH
═══════════════════════════════════════════ */
async function doLogin() {
  const username = qs('#login-user').value.trim();
  const password = qs('#login-pass').value;
  if (!username || !password) { toast('Please enter credentials', 'error'); return; }

  setBtnLoading('#login-btn', true, 'Signing in…');

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      const data = await res.json();
      STATE.token = data.token;
      STATE.user  = data.user_id || username;
      STATE.role  = data.role || 'investigator';

      localStorage.setItem('fl_token', STATE.token);
      localStorage.setItem('fl_user',  STATE.user);
      localStorage.setItem('fl_role',  STATE.role);

      setBtnLoading('#login-btn', false, '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Forensic Dashboard');
      toast(`Authenticated as ${STATE.user} (${roleLabel(STATE.role)})`, 'success');
      showMain();
      navigate('dashboard');
    } else {
      const err = await res.json().catch(() => ({}));
      setBtnLoading('#login-btn', false, '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Forensic Dashboard');
      toast(err.error || 'Invalid username or password', 'error');
    }
  } catch (err) {
    setBtnLoading('#login-btn', false, '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Forensic Dashboard');
    toast(`Connection failed: ${err.message}`, 'error');
  }
}

function doLogout() {
  localStorage.clear();
  STATE = { token: null, user: null, role: null, currentPage: null, evidenceList: [], auditPage: 1, auditPerPage: 20 };
  qs('#main-view').classList.add('hidden');
  qs('#main-view').classList.remove('flex');
  qs('#login-view').classList.remove('hidden');
}

function showMain() {
  qs('#login-view').classList.add('hidden');
  qs('#main-view').classList.remove('hidden');
  qs('#main-view').classList.add('flex');
  qs('#topbar-user').textContent = STATE.user;
  qs('#topbar-role').textContent = roleLabel(STATE.role);
  qs('#sidebar-user').textContent = STATE.user;
  qs('#sidebar-role').textContent = roleLabel(STATE.role);
}

function roleLabel(r) {
  return { admin:'Administrator', investigator:'Investigator', auditor:'Auditor' }[r] || r || 'User';
}

function setLogin(user, pwd) {
  qs('#login-user').value = user;
  qs('#login-pass').value = pwd;
}

function togglePwd() {
  const inp = qs('#login-pass');
  const ic  = qs('#pwd-eye');
  if (inp.type === 'password') { inp.type='text'; ic.className='fa-regular fa-eye-slash'; }
  else                         { inp.type='password'; ic.className='fa-regular fa-eye'; }
}

/* ═══════════════════════════════════════════
   ROUTING
═══════════════════════════════════════════ */
const PAGES = {
  dashboard:   renderDashboard,
  evidence:    renderEvidence,
  upload:      renderUpload,
  blockchain:  renderBlockchain,
  auditlog:    renderAuditLog,
  experiments: renderExperiments,
  reports:     renderReports,
};

const PAGE_TITLES = {
  dashboard:'Dashboard', evidence:'Evidence', upload:'Upload Evidence',
  blockchain:'Blockchain Explorer', auditlog:'Audit Log',
  experiments:'Experiments', reports:'Reports',
};

function navigate(page, extra) {
  if (!STATE.token) { return; }
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  qs('#topbar-title').textContent = PAGE_TITLES[page] || page;
  if (PAGES[page]) PAGES[page](extra);
  closeSidebar();
}

/* ═══════════════════════════════════════════
   SIDEBAR (mobile)
═══════════════════════════════════════════ */
function openSidebar()  { qs('#sidebar').style.transform='translateX(0)'; qs('#sidebar-overlay').classList.remove('hidden'); }
function closeSidebar() { qs('#sidebar').style.transform=''; qs('#sidebar-overlay').classList.add('hidden'); }

/* ═══════════════════════════════════════════
   API HELPERS
═══════════════════════════════════════════ */
async function apiFetch(path, opts = {}) {
  const url = `${API}${path}`;
  const headers = { ...(opts.headers || {}) };
  if (STATE.token) {
    headers['Authorization'] = `Bearer ${STATE.token}`;
  }
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401 && STATE.token) {
    doLogout();
    toast('Session expired or unauthorized', 'error');
    throw new Error('401');
  }
  return res;
}

async function apiJSON(path, opts = {}) {
  const res = await apiFetch(path, opts);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(txt || res.statusText);
  }
  return res.json();
}

/* ═══════════════════════════════════════════
   PAGE: DASHBOARD
═══════════════════════════════════════════ */
async function renderDashboard() {
  setPageHTML(`
    <div class="page space-y-6">
      <!-- stats row -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${statCard('fa-box-archive','Total Evidence','—','text-brand','stat-total')}
        ${statCard('fa-check-circle','Verified','—','text-green-400','stat-verified')}
        ${statCard('fa-link','Blocks','—','text-purple-400','stat-blocks')}
        ${statCard('fa-scroll','Audit Logs','—','text-amber-400','stat-audits')}
      </div>

      <!-- recent evidence + chain validity -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- recent evidence -->
        <div class="lg:col-span-2 bg-[#1e293b] rounded-xl border border-slate-700 p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold">Recent Evidence</h3>

async function navigate(page, extra) {
  if (!STATE.token) { return; }
  if (page === 'evidence-detail') {
    renderEvidenceDetail(extra);
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    qs('[data-page="evidence"]').classList.add('active');
    qs('#topbar-title').textContent = 'Evidence Detail';
    closeSidebar();
    return;
  }
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  qs('#topbar-title').textContent = PAGE_TITLES[page] || page;
  if (PAGES[page]) PAGES[page](extra);
  closeSidebar();
}

async function verifyEvidence(eid) {
  setBtnLoading('#verify-btn', true, 'Verifying…');
  qs('#verify-result').innerHTML = '';
  try {
    const res = await apiFetch(`/api/evidence/verify/${eid}`, { method:'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Verification failed');
    const ok = data.verified === true;
    qs('#verify-result').innerHTML = `
      <div class="flex items-center gap-2 text-sm font-medium ${ok ? 'text-green-400' : 'text-red-400'}">
        <i class="fa-solid ${ok ? 'fa-check-circle' : 'fa-xmark-circle'}"></i>
        ${data.status || (ok ? 'INTEGRITY VERIFIED' : 'INTEGRITY FAILED - HASH MISMATCH')}
      </div>`;
    toast(ok ? 'Evidence integrity verified!' : 'Integrity check FAILED: Hash mismatch!', ok ? 'success' : 'error');
  } catch (err) {
    qs('#verify-result').innerHTML = `<div class="flex items-center gap-2 text-sm text-red-400"><i class="fa-solid fa-triangle-exclamation"></i>${err.message}</div>`;
    toast(err.message, 'error');
  }
  setBtnLoading('#verify-btn', false, '<i class="fa-solid fa-shield-check"></i> Verify Integrity');
}

async function transferCustody(eid) {
  const newCustodian = qs('#transfer-to').value;

let selectedFile = null;
let selectedHash = null;

function onDragOver(e)  { e.preventDefault(); qs('#drop-zone').classList.add('drag-over'); }
function onDragLeave(e) { qs('#drop-zone').classList.remove('drag-over'); }
function onDrop(e)      { e.preventDefault(); qs('#drop-zone').classList.remove('drag-over'); processFile(e.dataTransfer.files[0]); }
function onFileSelected(e) { processFile(e.target.files[0]); }

async function processFile(file) {
  if (!file) return;
  selectedFile = file;
  selectedHash = null;
  qs('#file-preview').classList.remove('hidden');
  qs('#preview-name').textContent = file.name;
  qs('#preview-size').textContent = fmtSize(file.size);
  qs('#preview-sha').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Computing…';

  try {
    const buf  = await file.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', buf);
    const hex  = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    selectedHash = hex;
    qs('#preview-sha').innerHTML = `${hex} <button onclick="copyText('${hex}')" class="text-slate-400 hover:text-white"><i class="fa-regular fa-copy text-xs"></i></button>`;
  } catch(e) {
    qs('#preview-sha').innerHTML = '<span class="text-red-400">Error computing hash</span>';
  }
}

function clearFile() {
  selectedFile = null; selectedHash = null;
  qs('#file-preview').classList.add('hidden');
  qs('#file-input').value = '';
}

async function doUpload() {
  if (!selectedFile) { toast('Please select a file first', 'error'); return; }
  setBtnLoading('#upload-btn', true, 'Uploading…');

  const actor = qs('#upload-actor').value;
  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('actor', actor);
  if (selectedHash) fd.append('sha256', selectedHash);

  try {
    const res = await apiFetch('/api/evidence/upload', { method:'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    showUploadResult(data);
    toast('Evidence uploaded and anchored to blockchain!', 'success');
  } catch (err) {
    toast(err.message || 'Upload failed', 'error');
    qs('#upload-result').innerHTML = `<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-4 text-red-400 text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i>${err.message}</div>`;
    qs('#upload-result').classList.remove('hidden');
  }
  setBtnLoading('#upload-btn', false, '<i class="fa-solid fa-cloud-arrow-up"></i> Upload to Ledger');
}

function showUploadResult(data) {
  qs('#upload-result').classList.remove('hidden');
  qs('#upload-result-body').innerHTML = `
    ${resRow('Evidence ID', `<span class="font-mono text-brand">${data.evidence_id||'—'}</span>`)}

    ${resRow('SHA-256',     `<span class="hash text-green-400 break-all">${data.sha256||selectedHash||'—'}</span>`)}
    ${data.message ? resRow('Note', `<span class="text-slate-400 italic">${data.message}</span>`) : ''}
  `;
}
function resRow(k, v) { return `<div class="flex flex-col sm:flex-row sm:items-start gap-1"><span class="text-slate-400 w-32 flex-shrink-0 text-xs">${k}</span><span class="flex-1">${v}</span></div>`; }

function benchTable(results, maxMs) {
  return `
    <div class="overflow-x-auto">
      <table class="w-full text-sm mb-4">
        <thead>
          <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
            <th class="text-left px-4 py-3">File Size</th>
            <th class="text-left px-4 py-3">Bytes</th>
            <th class="text-left px-4 py-3">Time (ms)</th>
            <th class="text-left px-4 py-3 w-56">Relative Speed</th>
          </tr>
        </thead>
        <tbody>
          ${results.map(r => `
            <tr class="border-b border-slate-700/40 hover:bg-slate-700/20 transition">
              <td class="px-4 py-3 font-medium">${r.label}</td>
              <td class="px-4 py-3 text-slate-400 font-mono text-xs">${r.size.toLocaleString()}</td>
              <td class="px-4 py-3 font-mono text-brand">${r.ms.toFixed(4)} ms</td>
              <td class="px-4 py-3">
                <div class="bar-track w-48">
                  <div class="bar-fill" style="width:${Math.max(5, Math.round((r.ms/maxMs)*100))}%"></div>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function cryptoInfoCard(label, val, sub) {
  return `
  <div class="bg-[#0f172a] rounded-lg p-4 border border-slate-700">
    <div class="text-xs text-slate-400 mb-1">${label}</div>
    <div class="font-semibold text-sm">${val}</div>
    <div class="text-xs text-slate-500 mt-0.5">${sub}</div>
  </div>`;
}

async function runBenchmark() {
  setBtnLoading('#bench-btn', true, 'Benchmarking…');
  qs('#bench-results').innerHTML = `<div class="text-slate-400 text-sm text-center py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Running SHA-256 Benchmark across multiple payloads…</div>`;

  try {
    const res = await apiFetch('/api/experiment/benchmark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_sizes_kb: [1, 10, 100, 1024, 10240], iterations: 3 })
    });
    if (res.ok) {
      const data = await res.json();
      const arr = data.results.map(r => ({
        label: r.size_kb >= 1024 ? `${r.size_kb/1024} MB` : `${r.size_kb} KB`,
        size: r.size_bytes,
        ms: r.sha256_ms_avg
      }));
      const maxMs = Math.max(...arr.map(r => r.ms || 0.001));
      qs('#bench-results').innerHTML = benchTable(arr, maxMs);
      toast('Live server benchmark completed!', 'success');
      setBtnLoading('#bench-btn', false, '<i class="fa-solid fa-play"></i> Run Benchmark');
      return;
    }
  } catch(err) {
    console.warn('Backend benchmark failed, running client-side:', err);
  }

  /* In-browser Web Crypto API benchmark */
  const sizes = [1024, 10240, 102400, 1048576, 5242880];
  const labels = ['1 KB', '10 KB', '100 KB', '1 MB', '5 MB'];
  const results = [];
  for (let i = 0; i < sizes.length; i++) {
    const buf = new Uint8Array(sizes[i]);
    const t0 = performance.now();
    await crypto.subtle.digest('SHA-256', buf);
    const ms = performance.now() - t0;
    results.push({ label: labels[i], size: sizes[i], ms });
  }
  const maxMs = Math.max(...results.map(r => r.ms || 0.001));
  qs('#bench-results').innerHTML = benchTable(results, maxMs);
  toast('Browser crypto benchmark complete!', 'success');
  setBtnLoading('#bench-btn', false, '<i class="fa-solid fa-play"></i> Run Benchmark');
}

                <td class="px-5 py-3.5">
                  <div class="flex items-center gap-2">
                    <a href="${API}/api/evidence/${e.id}/report?format=pdf" target="_blank"
                       class="inline-flex items-center gap-1.5 text-xs bg-brand/10 hover:bg-brand/20
                              text-brand border border-brand/30 px-2.5 py-1 rounded-lg transition" title="Official PDF Report">
                      <i class="fa-solid fa-file-pdf"></i> PDF
                    </a>
                    <a href="${API}/api/evidence/${e.id}/report?format=txt" target="_blank"
                       class="inline-flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700
                              text-slate-300 border border-slate-600 px-2.5 py-1 rounded-lg transition" title="Plain-Text Record">
                      <i class="fa-solid fa-file-lines"></i> TXT
                    </a>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="px-5 py-3 border-t border-slate-700 text-xs text-slate-400">${list.length} report(s) available</div>
    `;
  } catch(e) {
    qs('#reports-list').innerHTML = `<div class="text-red-400 text-sm text-center py-10">${e.message}</div>`;
  }
}

/* ═══════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════ */
function qs(sel, ctx) { return (ctx || document).querySelector(sel); }

function setPageHTML(html) { qs('#page-area').innerHTML = html; }

function toast(msg, type = 'info') {
  const colors = { success:'bg-green-500', error:'bg-red-500', info:'bg-brand', warning:'bg-amber-500' };
  const icons  = { success:'fa-check-circle', error:'fa-xmark-circle', info:'fa-info-circle', warning:'fa-triangle-exclamation' };
  const el = document.createElement('div');
  el.className = `toast pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl
                  text-white text-sm font-medium max-w-xs ${colors[type]||colors.info}`;
  el.innerHTML = `<i class="fa-solid ${icons[type]||icons.info}"></i><span>${msg}</span>`;
  qs('#toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4100);
}

function setBtnLoading(sel, loading, labelHTML) {
  const btn = qs(sel);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) { btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${labelHTML}`; }
  else         { btn.innerHTML = labelHTML; }
}

function fmtSize(bytes) {
  if (bytes == null) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0; let v = bytes;
  while (v >= 1024 && i < units.length-1) { v /= 1024; i++; }
  return `${v.toFixed(i>0?1:0)} ${units[i]}`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch { return iso; }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard!', 'success'));
}

/* ═══════════════════════════════════════════
   KEYBOARD SHORTCUT
═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (!STATE.token) return;
  if (e.altKey) {
    const map = { d:'dashboard', e:'evidence', u:'upload', b:'blockchain', a:'auditlog', x:'experiments', r:'reports' };
    if (map[e.key]) { e.preventDefault(); navigate(map[e.key]); }
  }
});

/* ═══════════════════════════════════════════
   API CONNECTIVITY INDICATOR
═══════════════════════════════════════════ */
async function checkAPIStatus() {
  try {
    const r = await fetch(`${API}/api/health`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) qs('#api-status').classList.remove('hidden');
  } catch {}
}
setTimeout(checkAPIStatus, 1000);
